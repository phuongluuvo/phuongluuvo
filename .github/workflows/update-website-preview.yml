name: Update Website Preview

on:
  workflow_dispatch:

  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Take screenshot
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 900
              }
            });

            await page.goto('https://phuongluuvo.github.io', {
              waitUntil: 'networkidle'
            });

            await page.screenshot({
              path: 'website-preview.png',
              fullPage: false
            });

            await browser.close();
          })();
          EOF

      - name: Commit updated screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add website-preview.png

          if git diff --cached --quiet; then
            echo "No changes to website preview."
          else
            git commit -m "chore: update website preview"
            git push
          fi
