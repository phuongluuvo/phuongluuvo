name: Update Website Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Take website screenshot
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 }
            });

            await page.goto('https://phuongluuvo.github.io', {
              waitUntil: 'networkidle'
            });

            // REPLACE '.bio-container' WITH THE ACTUAL SELECTOR FROM YOUR WEBSITE
            // You might need to adjust this. For example: 'main', '.hero', '#bio', etc.
            const element = page.locator('.bio-container'); 
            
            // Wait for the element to be visible before screenshotting
            await element.waitFor();

            // Screenshot ONLY that specific element
            await element.screenshot({
              path: 'website-preview.png'
            });

            await browser.close();
          })();
          EOF

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-preview.png

          if git diff --cached --quiet; then
            echo "No changes to website-preview.png"
          else
            git commit -m "chore: update website preview"
            git push
          fi
